# Publishes main to the wiki of BristolMyersSquibb/blockr, where the pages are
# read. The merge queue pushes each group to the wiki before merging it, and an
# hourly run brings edits made on the wiki into main; .github/wiki-sync.sh says
# how the two stay on one line of history. This job is the only check the
# queue requires, since a group it has pushed has to be merged.
#
# It pushes to the wiki with WIKI_TOKEN, a fine-grained token on
# BristolMyersSquibb/blockr with Contents read and write, which is enough to
# push the workflow files there too, and to main with SPEC_DEPLOY_KEY, the
# private half of this repo's deploy key, which main's ruleset lets past.
name: Deploy wiki

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: Reset the wiki to main, dropping a commit a merge queue run left there
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nothing to deploy yet
        if: github.event_name == 'pull_request'
        run: echo "The merge queue pushes this PR to the wiki before merging it."

      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
          # Otherwise git sends this repo's token to the wiki, not WIKI_TOKEN.
          persist-credentials: false

      - name: Sync the wiki and main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.SPEC_DEPLOY_KEY }}
          WIKI: https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/BristolMyersSquibb/blockr.wiki.git
          SPEC: git@github.com:BristolMyersSquibb/blockr.spec.git
          MODE: ${{ github.event_name == 'merge_group' && 'queue' || inputs.reset && 'reset' || 'sync' }}
        run: |
          # The deploy key is what may push to main past its ruleset.
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          bash .github/wiki-sync.sh "$MODE"
